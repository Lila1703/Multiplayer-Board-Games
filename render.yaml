# Einstellungen für das kostenlose Hosting bei Render (render.com).
# Render liest diese Datei, wenn man das GitHub-Repo dort als "Blueprint" verbindet,
# und baut und startet das Spiel dann bei jedem Push auf main automatisch neu.
services:
  - type: web
    name: syncard            # ergibt die Adresse https://brettspiele.onrender.com (falls der Name noch frei ist)
    runtime: node
    plan: free                   # kostenlos: schläft nach 15 Minuten ohne Besucher ein, wacht beim nächsten Aufruf wieder auf
    region: frankfurt
    # --include=dev: Der Client wird mit Vite gebaut, das als Entwicklungs-Abhängigkeit eingetragen ist
    buildCommand: npm install && npm --prefix client install --include=dev && npm --prefix client run build
    startCommand: npm start
    healthCheckPath: /
